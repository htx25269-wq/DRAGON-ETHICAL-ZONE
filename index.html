            box-sizing: border-box;

        body {
            background: #07111f;
            color: white;
            text-align: center;
        }

        /* Top Header */
        .top-nav {
            background: #0a1629;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid #ff1e1e;
        }

        .top-nav img {
            width: 35px;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(180deg, #1d8fff 0%, #07111f 100%);
            padding: 60px 20px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #ff1e1e;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(255, 30, 30, 0.6);
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .owner-title {
            color: #ff7272;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .bio {
            max-width: 500px;
            margin: 0 auto 30px;
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Stats Section */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(12, 29, 51, 0.8);
            border: 1px solid #00aaff;
            padding: 15px;
            border-radius: 15px;
            min-width: 140px;
        }

        .stat-box h2 {
            color: #ff1e1e;
            font-size: 22px;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-icons a {
            background: #0c1d33;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            text-decoration: none;
            border: 1px solid #00aaff;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: #ff1e1e;
            border-color: #ff1e1e;
            transform: translateY(-5px);
        }

        /* Buttons */
        .action-btn {
            background: #ff1e1e;
            color: white;
            padding: 12px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 50px;
            box-shadow: 0 5px 15px rgba(255, 30, 30, 0.4);
        }

        .section-title {

            color: #00aaff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
